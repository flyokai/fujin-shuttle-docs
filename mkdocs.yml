site_name: Flyokai Fujin Shuttle
site_description: High-throughput CSV bulk import/export for Shopware 6 — documentation
site_url: https://fujin.flyokai.com/
repo_name: flyokai/flyokai
repo_url: https://github.com/flyokai/flyokai
edit_uri: edit/main/fujin-shuttle-docs/docs/
copyright: Copyright &copy; Flyokai

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/flyokai.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
    - Concepts & architecture: concepts.md
    - Data types: data-types.md
    - CSV format & columns: csv-reference.md
    - Admin UI & profiles: admin-ui.md
    - Media import: media-import.md
  - Reference:
    - CLI commands: cli.md
    - Configuration: configuration.md
    - Admin API: api.md
    - Database schema: database.md
    - Performance & tuning: PERFORMANCE.md
  - Troubleshooting: troubleshooting.md
  - Glossary: glossary.md
